<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng tuần hoàn hóa học - 118 Nguyên tố</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; background: linear-gradient(45deg, #00dbde, #fc00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        p.subtitle { color: #8a99ad; margin-bottom: 20px; font-size: 0.95rem; text-align: center; }
        
        .periodic-container { display: grid; grid-template-columns: repeat(18, minmax(45px, 60px)); gap: 5px; max-width: 1200px; overflow-x: auto; padding-bottom: 20px; }
        
        .element { background: #1a2236; border: 1px solid #2a3b5e; border-radius: 6px; padding: 5px; display: flex; flex-direction: column; justify-content: space-between; height: 75px; cursor: pointer; transition: all 0.2s ease; position: relative; }
        .element:hover { transform: scale(1.1); z-index: 10; border-color: #00dbde; box-shadow: 0 0 10px rgba(0, 219, 222, 0.5); }
        
        .number { font-size: 0.65rem; color: #8a99ad; }
        .symbol { font-size: 1.1rem; font-weight: bold; text-align: center; color: #fff; }
        .name { font-size: 0.55rem; text-align: center; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .alkali { background-color: #7f1d1d; border-color: #991b1b; }
        .alkaline-earth { background-color: #78350f; border-color: #92400e; }
        .transition { background-color: #1e3a8a; border-color: #1d4ed8; }
        .metalloid { background-color: #3f6212; border-color: #4d7c0f; }
        .reactive-nonmetal { background-color: #581c87; border-color: #6b21a8; }
        .noble-gas { background-color: #831843; border-color: #9d174d; }
        
        .empty { visibility: hidden; border: none; background: transparent; }

        .info-panel { margin-top: 25px; background: #131b2e; border: 1px solid #2a3b5e; padding: 20px; border-radius: 8px; width: 100%; max-width: 600px; text-align: center; }
        .info-panel h3 { color: #00dbde; margin-bottom: 8px; }
    </style>
</head>
<body>

    <h1>Bảng Tuần Hoàn Hóa Học</h1>
    <p class="subtitle">Ứng dụng tra cứu nguyên tố hóa học trực tuyến</p>

    <div class="periodic-container">
        <div class="element reactive-nonmetal" onclick="showInfo('Hydrogen', 'H', '1', 'Phi kim')"><span class="number">1</span><span class="symbol">H</span><span class="name">Hydrogen</span></div>
        <div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div>
        <div class="element noble-gas" onclick="showInfo('Helium', 'He', '2', 'Khí hiếm')"><span class="number">2</span><span class="symbol">He</span><span class="name">Helium</span></div>

        <div class="element alkali" onclick="showInfo('Lithium', 'Li', '3', 'Kim loại kiềm')"><span class="number">3</span><span class="symbol">Li</span><span class="name">Lithium</span></div>
        <div class="element alkaline-earth" onclick="showInfo('Beryllium', 'Be', '4', 'Kim loại kiềm thổ')"><span class="number">4</span><span class="symbol">Be</span><span class="name">Beryllium</span></div>
        <div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div>
        <div class="element metalloid" onclick="showInfo('Boron', 'B', '5', 'Á kim')"><span class="number">5</span><span class="symbol">B</span><span class="name">Boron</span></div>
        <div class="element reactive-nonmetal" onclick="showInfo('Carbon', 'C', '6', 'Phi kim')"><span class="number">6</span><span class="symbol">C</span><span class="name">Carbon</span></div>
        <div class="element reactive-nonmetal" onclick="showInfo('Nitrogen', 'N', '7', 'Phi kim')"><span class="number">7</span><span class="symbol">N</span><span class="name">Nitrogen</span></div>
        <div class="element reactive-nonmetal" onclick="showInfo('Oxygen', 'O', '8', 'Phi kim')"><span class="number">8</span><span class="symbol">O</span><span class="name">Oxygen</span></div>
        <div class="element reactive-nonmetal" onclick="showInfo('Fluorine', 'F', '9', 'Halogen')"><span class="number">9</span><span class="symbol">F</span><span class="name">Fluorine</span></div>
        <div class="element noble-gas" onclick="showInfo('Neon', 'Ne', '10', 'Khí hiếm')"><span class="number">10</span><span class="symbol">Ne</span><span class="name">Neon</span></div>
    </div>

    <div class="info-panel" id="infoPanel">
        <h3>Bấm vào một nguyên tố bất kỳ</h3>
        <p>Thông tin chi tiết về nguyên tố sẽ hiển thị tại đây.</p>
    </div>

    <script>
        function showInfo(name, symbol, number, category) {
            document.getElementById('infoPanel').innerHTML = `
                <h3>${name} (${symbol})</h3>
                <p>Số hiệu nguyên tử: <strong>${number}</strong></p>
                <p>Phân loại: <strong>${category}</strong></p>
            `;
        }
    </script>
</body>
</html>
